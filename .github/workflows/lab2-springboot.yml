name: LAB2 Spring Boot

on:
  push:
    paths:
      - "labs/lab2-springboot/**"
      - ".github/workflows/lab2-springboot.yml"
  pull_request:
    paths:
      - "labs/lab2-springboot/**"
      - ".github/workflows/lab2-springboot.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run LAB2 tests
        working-directory: labs/lab2-springboot
        run: mvn --batch-mode --no-transfer-progress test
