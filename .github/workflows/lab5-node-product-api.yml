name: LAB5 Node Express

on:
  push:
    paths:
      - "labs/lab5-node-product-api/**"
      - ".github/workflows/lab5-node-product-api.yml"
  pull_request:
    paths:
      - "labs/lab5-node-product-api/**"
      - ".github/workflows/lab5-node-product-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: labs/lab5-node-product-api/package-lock.json
      - name: Install dependencies
        working-directory: labs/lab5-node-product-api
        run: npm ci
      - name: Generate Swagger
        working-directory: labs/lab5-node-product-api
        run: npm run swagger
      - name: Run tests
        working-directory: labs/lab5-node-product-api
        run: npm test
